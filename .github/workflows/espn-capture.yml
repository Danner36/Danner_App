name: ESPN live capture

on:
  schedule:
    # Every 10 minutes during college basketball game hours (UTC).
    - cron: '*/10 15-23,0-6 * * *'
  workflow_dispatch:
    inputs:
      adapter:
        description: Adapter to capture (auto checks both NCAA basketball adapters)
        required: false
        type: choice
        options:
          - auto
          - ncaa/mens-basketball
          - ncaa/womens-basketball
        default: auto
      event:
        description: ESPN event id (digits; optional, must be in the Iowa State schedule)
        required: false
        type: string
        default: ''
      max_minutes:
        description: Capture limit in minutes (10 to 240)
        required: false
        type: string
        default: '180'

permissions:
  contents: read

jobs:
  find:
    name: Find a live Iowa State basketball game
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      adapter: ${{ steps.find.outputs.adapter }}
      event: ${{ steps.find.outputs.event }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Find event
        id: find
        env:
          ADAPTER: ${{ github.event_name == 'workflow_dispatch' && inputs.adapter || 'auto' }}
          EVENT: ${{ github.event_name == 'workflow_dispatch' && inputs.event || '' }}
        run: node scripts/espn-capture/capture.mjs find

  capture:
    name: Capture and commit
    needs: find
    if: needs.find.outputs.event != ''
    runs-on: ubuntu-latest
    timeout-minutes: 250
    permissions:
      contents: write
    concurrency:
      group: espn-capture-${{ needs.find.outputs.event }}
      cancel-in-progress: false
    env:
      ADAPTER: ${{ needs.find.outputs.adapter }}
      EVENT: ${{ needs.find.outputs.event }}
    steps:
      # Credentials stay persisted in this job only, for the push of the capture commit.
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Capture live game
        env:
          MAX_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_minutes || '180' }}
        run: node scripts/espn-capture/capture.mjs capture

      - name: Upload raw polls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-capture-${{ github.run_id }}
          path: ${{ runner.temp }}/espn-capture-raw
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

      - name: Commit trimmed captures
        if: ${{ !cancelled() }}
        run: |
          case "$ADAPTER" in
            ncaa/mens-basketball|ncaa/womens-basketball) ;;
            *)
              echo "::error::Adapter must be ncaa/mens-basketball or ncaa/womens-basketball."
              exit 1
              ;;
          esac
          if [[ ! "$EVENT" =~ ^[0-9]{1,12}$ ]]; then
            echo "::error::Event id must be 1 to 12 digits."
            exit 1
          fi
          adapter_dir="${ADAPTER//\//-}"
          dir="tests/leagues/${adapter_dir}/captures/${EVENT}"
          if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir")" ]; then
            echo "No capture to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dir"
          if git diff --cached --quiet; then
            echo "Capture already on main."
            exit 0
          fi
          git commit -m "capture: ${adapter_dir} event ${EVENT}"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt ${attempt} failed."
            sleep $((attempt * 10))
          done
          echo "::error::Capture commit was not pushed after 3 attempts."
          exit 1
