name: Patriots stream pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Extract and log without writing patriots_streams.json
        required: false
        type: boolean
        default: false
      force:
        description: Run even outside the 15-minute pregame window
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [patriots-get-video]

permissions:
  contents: write

jobs:
  extract:
    name: Extract and publish Patriots stream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/guardians-stream-pipeline/package-lock.json

      - name: Install pipeline packages
        working-directory: scripts/guardians-stream-pipeline
        run: npm ci

      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('scripts/guardians-stream-pipeline/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: scripts/guardians-stream-pipeline
        run: npx playwright install chromium --with-deps

      - name: Write pipeline config
        working-directory: scripts/guardians-stream-pipeline
        env:
          PATRIOTS_STREAM_PIPELINE_CONFIG: ${{ secrets.PATRIOTS_STREAM_PIPELINE_CONFIG }}
        run: |
          if [ -z "$PATRIOTS_STREAM_PIPELINE_CONFIG" ]; then
            echo "PATRIOTS_STREAM_PIPELINE_CONFIG secret is not set; using config.patriots.example.json."
            cp config.patriots.example.json config.json
          else
            printf '%s' "$PATRIOTS_STREAM_PIPELINE_CONFIG" > config.json
          fi

      - name: Run pipeline
        working-directory: scripts/guardians-stream-pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GUARDIANS_STREAM_CONFIG: config.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: node run.mjs
