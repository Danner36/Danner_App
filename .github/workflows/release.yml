name: Build and publish Danner Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  # v0 and v1 tags hold neither the suites ci.yml runs nor the certificate file, and they are built
  # against the v1 Worker, so a run of this file on such a tag makes none of the v2 checks.
  ci:
    name: Tests for the tag
    if: ${{ !startsWith(inputs.release_tag || github.ref_name, 'v0.') && !startsWith(inputs.release_tag || github.ref_name, 'v1.') }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

  checks:
    name: Release checks
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Worker health
        if: needs.ci.result == 'success'
        env:
          WORKER_URL: ${{ secrets.EXPO_PUBLIC_DANNER_WORKER_URL }}
        shell: bash
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo '::error::Secret EXPO_PUBLIC_DANNER_WORKER_URL is empty.'
            exit 1
          fi
          # Only the status code reaches the log, so the Worker origin is never printed.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors "${WORKER_URL%/}/health" 2>/dev/null || true)"
          if [ "$status" != '200' ]; then
            echo "::error::The Worker /health route answered ${status:-nothing}, not 200."
            exit 1
          fi

  android:
    name: Build Android APK
    needs: checks
    # GitHub's implicit success() also fails on a skipped job further up the chain, which ci is for
    # v0 and v1 tags, so this condition and the one on the release job name their results.
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Validate release tag
        working-directory: .
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::The release tag must be vMAJOR.MINOR.PATCH with digits only and minor and patch from 0 to 99."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm ci

      - name: Generate Android project
        env:
          EXPO_PUBLIC_APP_VERSION: ${{ env.RELEASE_TAG }}
          EXPO_PUBLIC_GUARDIANS_FAMILY_PIN: ${{ secrets.EXPO_PUBLIC_GUARDIANS_FAMILY_PIN }}
          EXPO_PUBLIC_GUARDIANS_GET_VIDEO_URL: ${{ secrets.EXPO_PUBLIC_GUARDIANS_GET_VIDEO_URL }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        env:
          EXPO_PUBLIC_APP_VERSION: ${{ env.RELEASE_TAG }}
          EXPO_PUBLIC_GUARDIANS_FAMILY_PIN: ${{ secrets.EXPO_PUBLIC_GUARDIANS_FAMILY_PIN }}
          EXPO_PUBLIC_GUARDIANS_GET_VIDEO_URL: ${{ secrets.EXPO_PUBLIC_GUARDIANS_GET_VIDEO_URL }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: ./android/gradlew --no-daemon -p android app:assembleRelease

      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../Danner-Apps-Android.apk

      # A changed certificate makes the phones refuse the update, and uninstalling wipes their data.
      - name: Verify signing certificate
        if: ${{ !startsWith(env.RELEASE_TAG, 'v0.') && !startsWith(env.RELEASE_TAG, 'v1.') }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < release/android-signing-cert.sha256)"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::release/android-signing-cert.sha256 is not one lowercase SHA-256.'
            exit 1
          fi
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          certs="$("${build_tools}apksigner" verify --print-certs Danner-Apps-Android.apk)"
          actual="$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($2)}' <<<"$certs" | sort -u)"
          if [ "$actual" != "$expected" ]; then
            echo '::error::The APK signing certificate does not match release/android-signing-cert.sha256.'
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: Danner-Apps-Android.apk
          if-no-files-found: error

  ios:
    name: Build SideStore IPA
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Validate release tag
        working-directory: .
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::The release tag must be vMAJOR.MINOR.PATCH with digits only and minor and patch from 0 to 99."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Generate iPhone project
        env:
          EXPO_PUBLIC_APP_VERSION: ${{ env.RELEASE_TAG }}
          EXPO_PUBLIC_GUARDIANS_FAMILY_PIN: ${{ secrets.EXPO_PUBLIC_GUARDIANS_FAMILY_PIN }}
          EXPO_PUBLIC_GUARDIANS_GET_VIDEO_URL: ${{ secrets.EXPO_PUBLIC_GUARDIANS_GET_VIDEO_URL }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned device app
        env:
          EXPO_PUBLIC_APP_VERSION: ${{ env.RELEASE_TAG }}
          EXPO_PUBLIC_GUARDIANS_FAMILY_PIN: ${{ secrets.EXPO_PUBLIC_GUARDIANS_FAMILY_PIN }}
          EXPO_PUBLIC_GUARDIANS_GET_VIDEO_URL: ${{ secrets.EXPO_PUBLIC_GUARDIANS_GET_VIDEO_URL }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(xcodebuild -workspace "$workspace" -list -json | python3 -c 'import json, sys; data=json.load(sys.stdin); print(next(item for item in data["workspace"]["schemes"] if not item.startswith("Pods-")))')"
          set +e
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/danner-ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            set +o pipefail
            grep -E "error:|fatal error:|undefined symbol" "$RUNNER_TEMP/xcodebuild.log" | head -80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 40 "$RUNNER_TEMP/xcodebuild.log" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find "$RUNNER_TEMP/danner-ios/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p "$RUNNER_TEMP/danner-payload/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/danner-payload/Payload/"
          cd "$RUNNER_TEMP/danner-payload"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/Danner-Apps-iOS.ipa"
          unzip -t "$GITHUB_WORKSPACE/Danner-Apps-iOS.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: Danner-Apps-iOS.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - android
      - ios
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      draft: ${{ steps.latest.outputs.draft }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Download Android APK
        uses: actions/download-artifact@v5
        with:
          name: android-release
          path: release-assets

      - name: Download iPhone IPA
        uses: actions/download-artifact@v5
        with:
          name: ios-release
          path: release-assets

      - name: Add setup guide, checksums, and update manifests
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          cp release/IPHONE_SETUP.md release-assets/IPHONE_SETUP.md
          node release/build-update-assets.mjs \
            "${RELEASE_TAG}" \
            release-assets/Danner-Apps-Android.apk \
            release-assets/Danner-Apps-iOS.ipa \
            release-assets
          cd release-assets
          sha256sum Danner-Apps-Android.apk Danner-Apps-iOS.ipa > SHA256SUMS.txt

      - name: Decide draft and Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A new major version stays a draft until the owner has installed it and publishes it by
          # hand. A failed lookup stops the job, so it cannot publish such a release by accident.
          published_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          published_major="${published_tag#v}"
          published_major="${published_major%%.*}"
          if [[ ! "$published_major" =~ ^[0-9]+$ ]]; then
            echo "::error::The latest published release has an unexpected tag."
            exit 1
          fi
          tag_major="${RELEASE_TAG#v}"
          tag_major="${tag_major%%.*}"
          if [ "$tag_major" -gt "$published_major" ]; then
            echo "::notice::$RELEASE_TAG is a new major version, so it is created as a draft."
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "flag=--draft" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "draft=false" >> "$GITHUB_OUTPUT"
          # Tag names come from the remote, so the shallow checkout does not limit them.
          highest="$(git ls-remote --tags --refs origin \
            | sed 's#^.*refs/tags/##' \
            | grep -E '^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$' \
            | sort -V \
            | tail -n 1)"
          if [ "$highest" = "$RELEASE_TAG" ]; then
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$RELEASE_TAG is older than $highest, so it is not marked Latest."
            echo "flag=--latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_FLAG: ${{ steps.latest.outputs.flag }}
        run: >-
          gh release create "${RELEASE_TAG}"
          release-assets/Danner-Apps-Android.apk
          release-assets/Danner-Apps-iOS.ipa
          release-assets/IPHONE_SETUP.md
          release-assets/SHA256SUMS.txt
          release-assets/version-manifest.json
          release-assets/sidestore-source.json
          --verify-tag
          "${PUBLISH_FLAG}"
          --title "Danner Apps ${RELEASE_TAG}"
          --notes-file release/RELEASE_NOTES.md
