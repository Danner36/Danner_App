# The name is the live Worker's name and is frozen. worker-deploy.yml deploys the staging copy with
# `--name guardians-get-video-staging`; the same bindings and migration apply to both, and the
# staging copy overrides GLOBAL_DISPATCH_PER_HOUR to 0 so it can never start a run.
name = "guardians-get-video"
main = "src/index.js"
compatibility_date = "2026-10-20"

[vars]
GITHUB_REPO = "Danner36/Danner_App"
COOLDOWN_SECONDS = 180
GAME_DISPATCH_MAX = 10
IP_TEAM_DISPATCH_PER_10_MIN = 3
IP_DISPATCH_PER_HOUR = 20
IP_FAILED_KEY_PER_HOUR = 10
GLOBAL_DISPATCH_PER_HOUR = 60
GLOBAL_IN_FLIGHT_MAX = 15

[[durable_objects.bindings]]
name = "TEAM_GATE"
class_name = "TeamGate"

[[durable_objects.bindings]]
name = "GLOBAL_GATE"
class_name = "GlobalGate"

[[migrations]]
tag = "v2-gates"
new_sqlite_classes = ["TeamGate", "GlobalGate"]

# Counted per IP on /streams, /catalog and /health?deep=1. Without the binding the Worker keeps the
# same limit per isolate.
[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
